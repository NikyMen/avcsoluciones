server {
    listen 80;
    listen [::]:80;
    server_name avcsoluciones.com.py www.avcsoluciones.com.py;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3550;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If the domain is behind Cloudflare, this lets the admin traffic map
        # receive the country code detected by Cloudflare.
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}
